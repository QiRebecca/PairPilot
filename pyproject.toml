[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = [
  "packages/schemas",
  "services/orchestrator",
  "services/peer_agents",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

