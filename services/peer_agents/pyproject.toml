[project]
name = "pairpilot-peer-agents"
version = "0.1.0"
description = "Independent PairPilot A2A personal-agent service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "cryptography==46.0.3",
  "google-adk==2.8.0",
  "google-genai==2.20.0",
  "pydantic==2.13.5",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairpilot_peer_agents", "pairpilot_schemas"]
